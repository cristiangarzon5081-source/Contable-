<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Contable" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Contable</title>
</head>
<body>
  <div id="app">
    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="16" fill="#6366f1"/>
          <path d="M20 44 L32 20 L44 44" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M24 36 L40 36" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>Contable</span>
      </div>
    </div>
    <div id="main" class="hidden">
      <header class="app-header">
        <div class="header-content">
          <span class="app-title">Contable</span>
          <button id="btn-add" class="btn-fab-header" aria-label="Agregar movimiento">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </header>
      <main id="view-container"></main>
      <nav class="bottom-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Inicio</span>
        </button>
        <button class="nav-item" data-view="historial">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>Historial</span>
        </button>
        <button class="nav-item" data-view="prestamos">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Préstamos</span>
        </button>
        <button class="nav-item" data-view="estadisticas">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>Estadísticas</span>
        </button>
        <button class="nav-item" data-view="categorias">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
          <span>Categorías</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Modal de entrada rápida -->
  <div id="modal-entrada" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Registrar movimiento</h2>

      <div class="tipo-selector">
        <button class="tipo-btn active" data-tipo="egreso">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          Egreso
        </button>
        <button class="tipo-btn" data-tipo="ingreso">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Ingreso
        </button>
      </div>

      <!-- Campo descripción — siempre primero -->
      <div class="desc-field-wrap">
        <input type="text" id="input-descripcion" class="input-desc"
          placeholder="¿Qué compraste o pagaste? Ej: taxi, 3 mangos y una camiseta..."
          autocomplete="off" />
        <!-- Indicador categoría única (modo simple) -->
        <div id="cat-detectada" class="cat-detectada hidden"></div>
      </div>

      <!-- Panel multi-producto (modo multi) -->
      <div id="multi-panel" class="multi-panel hidden"></div>

      <!-- Monto total — en modo multi se calcula automático y se deshabilita -->
      <div class="input-monto-wrap" id="monto-wrap">
        <span class="currency-symbol">$</span>
        <input type="text" id="input-monto" class="input-monto" placeholder="0" inputmode="numeric" autocomplete="off" />
      </div>
      <div id="monto-auto-label" class="monto-auto-label hidden">Total calculado automáticamente</div>

      <div class="form-row">
        <div class="form-group">
          <label>Cuenta</label>
          <select id="select-cuenta" class="select-field">
            <option value="efectivo">💵 Efectivo</option>
            <option value="tarjeta_debito">💳 Tarjeta débito</option>
            <option value="tarjeta_credito">💳 Tarjeta crédito</option>
            <option value="banco">🏦 Banco</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="input-fecha" class="select-field" />
        </div>
      </div>

      <button id="btn-guardar" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar
      </button>
    </div>
  </div>

  <!-- Selector de categoría en línea (para corregir categoría detectada) -->
  <div id="modal-cat-selector" class="modal hidden" style="z-index:60;">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet" style="max-height:70vh;">
      <div class="modal-handle"></div>
      <h3 class="modal-title" style="font-size:17px;">Cambiar categoría</h3>
      <div id="cat-selector-lista" class="cat-selector-lista"></div>
    </div>
  </div>

  <!-- Modal de préstamo -->
  <div id="modal-prestamo" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Registrar préstamo</h2>

      <div class="tipo-selector">
        <button class="tipo-btn active" data-prestamo="debo">Yo debo</button>
        <button class="tipo-btn" data-prestamo="me_deben">Me deben</button>
      </div>

      <div class="input-monto-wrap">
        <span class="currency-symbol">$</span>
        <input type="text" id="prestamo-monto" class="input-monto" placeholder="0" inputmode="numeric" />
      </div>

      <input type="text" id="prestamo-persona" class="input-desc" placeholder="Nombre (persona, banco, entidad...)" />

      <div class="form-row">
        <div class="form-group">
          <label>Fecha inicio</label>
          <input type="date" id="prestamo-fecha-inicio" class="select-field" />
        </div>
        <div class="form-group">
          <label>Fecha límite</label>
          <input type="date" id="prestamo-fecha-fin" class="select-field" placeholder="Opcional" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Interés mensual (%)</label>
          <input type="number" id="prestamo-interes" class="select-field" placeholder="0 = sin interés" min="0" step="0.1" />
        </div>
        <div class="form-group">
          <label>N° cuotas</label>
          <input type="number" id="prestamo-cuotas" class="select-field" placeholder="Libre" min="1" />
        </div>
      </div>

      <div id="prestamo-preview" class="prestamo-preview hidden"></div>

      <input type="text" id="prestamo-nota" class="input-desc" placeholder="Nota opcional..." />

      <button id="btn-guardar-prestamo" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar préstamo
      </button>
    </div>
  </div>

  <!-- Modal abono préstamo -->
  <div id="modal-abono" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="abono-titulo">Registrar abono</h2>
      <div class="input-monto-wrap">
        <span class="currency-symbol">$</span>
        <input type="text" id="abono-monto" class="input-monto" placeholder="0" inputmode="numeric" />
      </div>
      <input type="date" id="abono-fecha" class="select-field" style="width:100%;margin-bottom:12px;" />
      <input type="text" id="abono-nota" class="input-desc" placeholder="Nota (opcional)" />
      <button id="btn-guardar-abono" class="btn-primary">Registrar abono</button>
    </div>
  </div>

  <!-- Modal editar / crear categoría -->
  <div id="modal-categoria" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="modal-cat-titulo">Nueva categoría</h2>
      <span id="cat-edit-slug-display" style="font-size:11px;color:var(--text3);display:block;margin-top:-12px;margin-bottom:14px;"></span>

      <div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-end;">
        <div>
          <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px;">Emoji</label>
          <input type="text" id="cat-edit-emoji" class="select-field"
            style="width:64px;text-align:center;font-size:24px;padding:8px 4px;" maxlength="4" />
        </div>
        <div style="flex:1;">
          <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px;">Nombre</label>
          <input type="text" id="cat-edit-nombre" class="input-desc"
            style="margin-bottom:0;" placeholder="Ej: Gimnasio, Ahorros..." />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:12px;">
        <label style="font-size:12px;color:var(--text3);">Aplica a</label>
        <select id="cat-edit-tipo" class="select-field" style="margin-top:4px;">
          <option value="egreso">Egresos</option>
          <option value="ingreso">Ingresos</option>
          <option value="ambos">Ambos</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px;">Palabras clave para detección automática</label>
        <textarea id="cat-edit-palabras" class="input-desc"
          style="height:72px;resize:none;font-size:14px;"
          placeholder="gimnasio, pesas, crossfit, membresía gym..."></textarea>
        <p id="cat-edit-palabras-hint" style="font-size:11px;color:var(--text3);margin-top:4px;">
          Separa las palabras con coma. Cuando escribas algo que las contenga, se detectará esta categoría.
        </p>
      </div>

      <button id="btn-guardar-cat" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar categoría
      </button>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/historial.js"></script>
  <script src="js/views/prestamos.js"></script>
  <script src="js/views/estadisticas.js"></script>
  <script src="js/views/categorias.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
